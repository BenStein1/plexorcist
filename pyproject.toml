[project]
name = "plexorcist"
version = "0.1.0"
description = "Conversational concierge for Plex and Ombi request workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.130.0,<1",
  "fastmcp>=3.4,<4",
  "gunicorn>=23.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "clients*", "tools*"]
